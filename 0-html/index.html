<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enkelt formulär enbart HTML</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="parent">
      <h1>Contact Form</h1>
      <h2>Practice makes perfect</h2>
      <form action="#">
        <fieldset><input type="text" placeholder="Your nice name" /></fieldset>
        <fieldset>
          <input type="email" placeholder="Your Strange Email Adress" />
        </fieldset>
        <fieldset>
          <input
            type="number"
            placeholder="Your Very Private Phone Number (optional)"
          />
        </fieldset>
        <fieldset>
          <input type="text" placeholder="Your Web Site (optional)" />
        </fieldset>
        <fieldset>
          <textarea
            name="message"
            id="textarea"
            placeholder="Type your message here...."
          ></textarea>
        </fieldset>
        <fieldset>
          <button id="button">Submit (to me)</button>
        </fieldset>
      </form>
    </div>
  </body>
</html>
